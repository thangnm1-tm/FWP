# Staged Codex profile. Install as %USERPROFILE%\.codex\thinkingjack.config.toml
# and install the catalog at the absolute path below before running:
#   codex --profile thinkingjack

model = "thinkingJack1"
model_provider = "thinkingjack"
model_catalog_json = 'C:\Users\Admin\.codex\model-catalogs\thinkingjack.json'
web_search = "disabled"

[model_providers.thinkingjack]
name = "ThinkingJack"
base_url = "https://thinkingjack.com/v1"
wire_api = "responses"
env_key = "THINKINGJACK_API_KEY"
env_key_instructions = "Set THINKINGJACK_API_KEY to a current ThinkingJack API key before starting this profile."
requires_openai_auth = false
supports_websockets = false
request_max_retries = 1
stream_max_retries = 1

