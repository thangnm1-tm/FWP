services:
  # ──────────────── PostgreSQL + PostGIS ────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fwp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fwp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fwp_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fwp_db}
    # Host binding is restricted to loopback by default. Only publish beyond
    # 127.0.0.1 when you fully intend to expose the database (e.g. set
    # POSTGRES_BIND=0.0.0.0 behind a firewall/private network).
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./infrastructure/migration-v1.sql:/docker-entrypoint-initdb.d/02-migration-v1.sql
      - ./infrastructure:/infrastructure:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fwp_user} -d ${POSTGRES_DB:-fwp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────── Redis ────────────────
  redis:
    image: redis:7-alpine
    container_name: fwp-redis
    restart: unless-stopped
    # Loopback-only unless REDIS_BIND is explicitly overridden.
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────── NestJS Backend ────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fwp-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-fwp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fwp_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fwp_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Secrets MUST come from .env / a secret manager. The dev fallback is
      # intentionally obvious and weak; rotate it before any shared deploy.
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_dev_only_jwt_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-CHANGE_ME_dev_only_jwt_refresh_secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TIMEOUT: ${ML_SERVICE_TIMEOUT:-3000}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-stu.ptit.edu.vn}
      NODE_ENV: ${NODE_ENV:-development}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      # Local demos may bypass SMTP while retaining the production mail path.
      OTP_DELIVERY_MODE: ${OTP_DELIVERY_MODE:-smtp}
      DEMO_OTP: ${DEMO_OTP:-123456}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Keep Linux-native packages out of the Windows bind mount.
      - backend_node_modules:/app/node_modules

  # ──────────────── ML Ranking Service ────────────────
  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: fwp-ml-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-fwp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fwp_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fwp_db}
      MODEL_PATH: /app/artifacts/active_model
      ML_CORS_ORIGINS: ${ML_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ML_RELOAD_TOKEN: ${ML_RELOAD_TOKEN:-}
    # Loopback-only unless ML_BIND is explicitly overridden.
    ports:
      - "${ML_BIND:-127.0.0.1}:${ML_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ml:/app
      - ml_artifacts:/app/artifacts

  # Periodically rebuild the ranker from real, impression-backed Postgres events.
  ml-retrainer:
    build:
      context: ./ml
      dockerfile: Dockerfile
    command: python -m scripts.retrain --interval-hours ${RETRAIN_INTERVAL_HOURS:-24}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-fwp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fwp_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fwp_db}
      RETRAIN_MIN_EVENTS: ${RETRAIN_MIN_EVENTS:-100}
      ML_RELOAD_URL: ${ML_RELOAD_URL:-http://ml-service:8000/v1/reload}
      ML_RELOAD_TOKEN: ${ML_RELOAD_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ml:/app
      - ml_artifacts:/app/artifacts

volumes:
  backend_node_modules:
  postgres_data:
  redis_data:
  ml_artifacts:
