<!doctype html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>FwP — Friend with PTIT</title><link rel="stylesheet" href="styles.css"/></head><body>
<main class="shell"><header><a class="brand">fwp<span>♥</span></a><p id="connection">Chưa kết nối</p></header>
<section id="authView" class="panel auth"><h1>Tìm một người cùng tần số.</h1><p>Demo web cho Friend with PTIT.</p><form id="registerForm"><label>Email PTIT<input id="email" type="email" placeholder="ban@stu.ptit.edu.vn" required></label><label>Mật khẩu<input id="password" type="password" minlength="8" required></label><button>Tạo tài khoản & gửi OTP</button></form><form id="otpForm" hidden><label>Mã OTP<input id="otp" inputmode="numeric" maxlength="6" required></label><button>Xác thực</button></form><form id="loginForm"><button type="button" class="link" id="showLogin">Đã có tài khoản? Đăng nhập</button><div id="loginFields" hidden><label>Email<input id="loginEmail" type="email" required></label><label>Mật khẩu<input id="loginPassword" type="password" required></label><button>Đăng nhập</button></div></form><p class="notice" id="authNotice"></p></section>
<section id="appView" hidden><nav><button data-tab="swipe" class="active">Khám phá</button><button data-tab="profile">Hồ sơ</button><button data-tab="chat">Tin nhắn <i id="chatBadge"></i></button></nav>
 <div id="swipe" class="tab active"><div class="card"><div class="avatar gradient">N</div><h2 id="cardName">Ngọc Anh</h2><p id="cardMeta">KTPM · K66 · PTIT</p><p id="cardBio">Coffee, photography và những dự án nhỏ xinh.</p><div class="chips"><span>Photography</span><span>AI/ML</span><span>Coffee</span></div></div><div class="swipe-actions"><button class="pass" id="pass">×</button><button class="like" id="like">♥</button></div><p class="notice" id="swipeNotice"></p></div>
 <div id="profile" class="tab"><div class="panel"><h2>Hồ sơ của bạn</h2><form id="profileForm"><label>Tên hiển thị<input id="displayName" required></label><label>Giới thiệu<textarea id="bio" rows="3"></textarea></label><label>Ảnh đại diện<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="photoPreview" hidden alt="Ảnh đại diện"/><button>Lưu hồ sơ</button></form></div></div>
 <div id="chat" class="tab"><aside id="roomList"><h2>Kết nối</h2><p>Chưa có cuộc trò chuyện</p></aside><section class="conversation"><header id="activePeer" class="conversation-header" hidden><div class="peer-avatar"><img id="peerAvatar" hidden alt=""><span id="peerAvatarFallback">♥</span></div><div><strong id="peerName"></strong><small>Đã kết nối</small></div></header><div id="messages"><p class="empty">Chọn một kết nối để bắt đầu trò chuyện.</p></div><div id="typing"></div><form id="messageForm"><input id="message" placeholder="Viết một điều dễ thương…" autocomplete="off" disabled><button disabled>Gửi</button></form></section></div>
</section></main><script src="http://localhost:3000/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
